<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .small { fill: #94a3b8; font-size: 9px; }
      .tiny { fill: #cbd5e1; font-size: 8px; }
      .client { fill: rgba(59,130,246,0.34); stroke: #60a5fa; stroke-width: 1.5; }
      .namenode { fill: rgba(120,53,15,0.36); stroke: #fbbf24; stroke-width: 1.5; }
      .datanode { fill: rgba(6,78,59,0.42); stroke: #34d399; stroke-width: 1.5; }
      .packet { fill: rgba(76,29,149,0.44); stroke: #a78bfa; stroke-width: 1.1; }
      .read-line { fill: none; stroke: #34d399; stroke-width: 1.7; marker-end: url(#arrow-green); }
      .write-line { fill: none; stroke: #fbbf24; stroke-width: 1.7; marker-end: url(#arrow-amber); }
      .meta-line { fill: none; stroke: #60a5fa; stroke-width: 1.4; marker-end: url(#arrow-blue); }
      .ack-line { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1180" height="720" fill="#0f172a"/>
  <rect width="1180" height="720" fill="url(#grid)"/>

  <text x="34" y="38" class="title">HDFS 读写路径</text>
  <text x="34" y="58" class="subtitle">NameNode 只参与元数据决策；真正的数据读写在 Client 与 DataNode 之间进行，写入时通过 pipeline 复制。</text>

  <text x="58" y="102" fill="#34d399" font-size="13" font-weight="700">Read Path</text>
  <rect x="58" y="132" width="156" height="70" rx="8" fill="#0f172a"/>
  <rect x="58" y="132" width="156" height="70" rx="8" class="client"/>
  <text x="136" y="161" text-anchor="middle" class="label">Client</text>
  <text x="136" y="181" text-anchor="middle" class="small">open(file)</text>

  <rect x="376" y="132" width="210" height="70" rx="8" fill="#0f172a"/>
  <rect x="376" y="132" width="210" height="70" rx="8" class="namenode"/>
  <text x="481" y="161" text-anchor="middle" class="label">NameNode</text>
  <text x="481" y="181" text-anchor="middle" class="small">return block locations</text>

  <g transform="translate(758 98)">
    <rect x="0" y="0" width="146" height="54" rx="7" fill="#0f172a"/>
    <rect x="0" y="0" width="146" height="54" rx="7" class="datanode"/>
    <text x="73" y="22" text-anchor="middle" class="label">DataNode 1</text>
    <text x="73" y="40" text-anchor="middle" class="tiny">nearest replica</text>
    <rect x="0" y="72" width="146" height="54" rx="7" fill="#0f172a"/>
    <rect x="0" y="72" width="146" height="54" rx="7" class="datanode"/>
    <text x="73" y="94" text-anchor="middle" class="label">DataNode 2</text>
    <text x="73" y="112" text-anchor="middle" class="tiny">another replica</text>
    <rect x="0" y="144" width="146" height="54" rx="7" fill="#0f172a"/>
    <rect x="0" y="144" width="146" height="54" rx="7" class="datanode"/>
    <text x="73" y="166" text-anchor="middle" class="label">DataNode 3</text>
    <text x="73" y="184" text-anchor="middle" class="tiny">fallback on error</text>
  </g>

  <path d="M 214 154 C 270 136, 315 136, 376 154" class="meta-line"/>
  <path d="M 376 184 C 310 210, 268 208, 214 184" class="meta-line"/>
  <text x="282" y="128" class="tiny" fill="#60a5fa">1. ask metadata</text>
  <text x="263" y="224" class="tiny" fill="#60a5fa">2. blocks + replicas</text>
  <path d="M 214 174 C 410 252, 606 156, 758 125" class="read-line"/>
  <path d="M 214 194 C 418 286, 602 224, 758 197" class="read-line"/>
  <text x="444" y="268" class="tiny" fill="#34d399">3. stream block data, verify checksum</text>

  <line x1="42" y1="304" x2="1138" y2="304" stroke="#334155" stroke-width="1"/>

  <text x="58" y="350" fill="#fbbf24" font-size="13" font-weight="700">Write Path</text>
  <rect x="58" y="388" width="156" height="72" rx="8" fill="#0f172a"/>
  <rect x="58" y="388" width="156" height="72" rx="8" class="client"/>
  <text x="136" y="417" text-anchor="middle" class="label">Client</text>
  <text x="136" y="437" text-anchor="middle" class="small">create(file)</text>

  <rect x="376" y="388" width="210" height="72" rx="8" fill="#0f172a"/>
  <rect x="376" y="388" width="210" height="72" rx="8" class="namenode"/>
  <text x="481" y="417" text-anchor="middle" class="label">NameNode</text>
  <text x="481" y="437" text-anchor="middle" class="small">choose target DataNodes</text>

  <g transform="translate(730 364)">
    <rect x="0" y="0" width="150" height="68" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="68" rx="8" class="datanode"/>
    <text x="75" y="27" text-anchor="middle" class="label">DataNode A</text>
    <text x="75" y="47" text-anchor="middle" class="tiny">replica 1</text>
  </g>
  <g transform="translate(938 462)">
    <rect x="0" y="0" width="150" height="68" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="68" rx="8" class="datanode"/>
    <text x="75" y="27" text-anchor="middle" class="label">DataNode B</text>
    <text x="75" y="47" text-anchor="middle" class="tiny">replica 2</text>
  </g>
  <g transform="translate(730 560)">
    <rect x="0" y="0" width="150" height="68" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="68" rx="8" class="datanode"/>
    <text x="75" y="27" text-anchor="middle" class="label">DataNode C</text>
    <text x="75" y="47" text-anchor="middle" class="tiny">replica 3</text>
  </g>

  <path d="M 214 410 C 278 386, 318 386, 376 410" class="meta-line"/>
  <path d="M 376 442 C 312 476, 270 472, 214 442" class="meta-line"/>
  <text x="274" y="382" class="tiny" fill="#60a5fa">1. create RPC</text>
  <text x="265" y="490" class="tiny" fill="#60a5fa">2. target pipeline</text>

  <path d="M 214 442 C 412 520, 584 392, 730 398" class="write-line"/>
  <path d="M 880 398 C 916 402, 928 444, 938 490" class="write-line"/>
  <path d="M 1012 530 C 962 598, 914 598, 880 594" class="write-line"/>
  <text x="520" y="510" class="tiny" fill="#fbbf24">3. packets flow through pipeline</text>

  <path d="M 880 594 C 914 552, 930 524, 938 500" class="ack-line"/>
  <path d="M 938 490 C 916 446, 890 410, 880 398" class="ack-line"/>
  <path d="M 730 398 C 650 410, 420 482, 214 450" class="ack-line"/>
  <text x="436" y="610" class="tiny">4. acknowledgements return backwards; close commits file length</text>

  <g transform="translate(328 538)">
    <rect x="0" y="0" width="242" height="64" rx="7" fill="rgba(30,41,59,0.64)" stroke="#475569" stroke-width="1"/>
    <text x="121" y="23" text-anchor="middle" class="label">Packet Queue</text>
    <rect x="28" y="38" width="36" height="16" rx="3" class="packet"/>
    <rect x="74" y="38" width="36" height="16" rx="3" class="packet"/>
    <rect x="120" y="38" width="36" height="16" rx="3" class="packet"/>
    <rect x="166" y="38" width="36" height="16" rx="3" class="packet"/>
  </g>
</svg>
