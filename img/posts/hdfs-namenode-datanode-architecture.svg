<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .small { fill: #94a3b8; font-size: 9px; }
      .tiny { fill: #cbd5e1; font-size: 8px; }
      .region { fill: none; stroke: #fbbf24; stroke-width: 1.2; stroke-dasharray: 9 5; }
      .client { fill: rgba(59,130,246,0.34); stroke: #60a5fa; stroke-width: 1.5; }
      .namenode { fill: rgba(120,53,15,0.36); stroke: #fbbf24; stroke-width: 1.5; }
      .metadata { fill: rgba(30,41,59,0.62); stroke: #94a3b8; stroke-width: 1.2; }
      .rack { fill: rgba(15,23,42,0.56); stroke: #475569; stroke-width: 1.1; }
      .datanode { fill: rgba(6,78,59,0.42); stroke: #34d399; stroke-width: 1.5; }
      .block { fill: rgba(76,29,149,0.44); stroke: #a78bfa; stroke-width: 1.1; }
      .meta-line { fill: none; stroke: #60a5fa; stroke-width: 1.5; marker-end: url(#arrow-blue); }
      .data-line { fill: none; stroke: #34d399; stroke-width: 1.7; marker-end: url(#arrow-green); }
      .report-line { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#0f172a"/>
  <rect width="1200" height="680" fill="url(#grid)"/>

  <text x="34" y="38" class="title">HDFS 基本架构</text>
  <text x="34" y="58" class="subtitle">NameNode 管理命名空间和 block 映射；DataNode 保存真实 block；Client 只向 NameNode 请求元数据，数据流直接走 DataNode。</text>

  <rect x="270" y="86" width="690" height="508" rx="14" class="region"/>
  <text x="290" y="108" fill="#fbbf24" font-size="10" font-weight="600">HDFS Cluster</text>

  <rect x="44" y="250" width="170" height="90" rx="8" fill="#0f172a"/>
  <rect x="44" y="250" width="170" height="90" rx="8" class="client"/>
  <text x="129" y="284" text-anchor="middle" class="label">Client</text>
  <text x="129" y="304" text-anchor="middle" class="small">open / create / read</text>
  <text x="129" y="320" text-anchor="middle" class="tiny">HDFS API / CLI / Spark</text>

  <g transform="translate(445 122)">
    <rect x="0" y="0" width="320" height="118" rx="9" fill="#0f172a"/>
    <rect x="0" y="0" width="320" height="118" rx="9" class="namenode"/>
    <text x="160" y="31" text-anchor="middle" class="label">NameNode</text>
    <text x="160" y="51" text-anchor="middle" class="small">namespace + block map + leases</text>
    <rect x="24" y="72" width="122" height="28" rx="5" class="metadata"/>
    <text x="85" y="90" text-anchor="middle" class="tiny">FsImage</text>
    <rect x="174" y="72" width="122" height="28" rx="5" class="metadata"/>
    <text x="235" y="90" text-anchor="middle" class="tiny">EditLog</text>
  </g>

  <path d="M 214 278 C 300 238, 350 186, 445 181" class="meta-line"/>
  <path d="M 445 205 C 350 218, 300 290, 214 310" class="meta-line"/>
  <text x="255" y="240" class="tiny" fill="#60a5fa">metadata RPC</text>

  <path d="M 214 326 C 322 380, 357 478, 417 492" class="data-line"/>
  <text x="252" y="415" class="tiny" fill="#34d399">block data</text>

  <g transform="translate(315 312)">
    <rect x="0" y="0" width="250" height="230" rx="10" class="rack"/>
    <text x="18" y="24" class="small" fill="#cbd5e1">Rack A</text>
    <g transform="translate(28 48)">
      <rect x="0" y="0" width="190" height="56" rx="7" fill="#0f172a"/>
      <rect x="0" y="0" width="190" height="56" rx="7" class="datanode"/>
      <text x="95" y="23" text-anchor="middle" class="label">DataNode A1</text>
      <text x="95" y="42" text-anchor="middle" class="tiny">blk_001, blk_003</text>
    </g>
    <g transform="translate(28 128)">
      <rect x="0" y="0" width="190" height="56" rx="7" fill="#0f172a"/>
      <rect x="0" y="0" width="190" height="56" rx="7" class="datanode"/>
      <text x="95" y="23" text-anchor="middle" class="label">DataNode A2</text>
      <text x="95" y="42" text-anchor="middle" class="tiny">blk_002, blk_003</text>
    </g>
  </g>

  <g transform="translate(650 312)">
    <rect x="0" y="0" width="250" height="230" rx="10" class="rack"/>
    <text x="18" y="24" class="small" fill="#cbd5e1">Rack B</text>
    <g transform="translate(28 48)">
      <rect x="0" y="0" width="190" height="56" rx="7" fill="#0f172a"/>
      <rect x="0" y="0" width="190" height="56" rx="7" class="datanode"/>
      <text x="95" y="23" text-anchor="middle" class="label">DataNode B1</text>
      <text x="95" y="42" text-anchor="middle" class="tiny">blk_001, blk_002</text>
    </g>
    <g transform="translate(28 128)">
      <rect x="0" y="0" width="190" height="56" rx="7" fill="#0f172a"/>
      <rect x="0" y="0" width="190" height="56" rx="7" class="datanode"/>
      <text x="95" y="23" text-anchor="middle" class="label">DataNode B2</text>
      <text x="95" y="42" text-anchor="middle" class="tiny">blk_001, blk_002, blk_003</text>
    </g>
  </g>

  <path d="M 440 312 C 480 270, 520 252, 572 240" class="report-line"/>
  <path d="M 740 312 C 710 272, 675 252, 638 240" class="report-line"/>
  <text x="744" y="276" class="tiny">heartbeat + block report</text>

  <g transform="translate(990 184)">
    <rect x="0" y="0" width="168" height="296" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="168" height="296" rx="8" class="metadata"/>
    <text x="84" y="30" text-anchor="middle" class="label">File Metadata</text>
    <text x="84" y="51" text-anchor="middle" class="small">/warehouse/orders</text>
    <rect x="26" y="80" width="116" height="38" rx="5" class="block"/>
    <text x="84" y="103" text-anchor="middle" class="tiny">block 0: blk_001</text>
    <rect x="26" y="134" width="116" height="38" rx="5" class="block"/>
    <text x="84" y="157" text-anchor="middle" class="tiny">block 1: blk_002</text>
    <rect x="26" y="188" width="116" height="38" rx="5" class="block"/>
    <text x="84" y="211" text-anchor="middle" class="tiny">block 2: blk_003</text>
    <text x="84" y="256" text-anchor="middle" class="small">replication=3</text>
    <text x="84" y="274" text-anchor="middle" class="tiny">block size usually 128MB</text>
  </g>

  <path d="M 765 164 C 880 155, 938 235, 990 247" class="meta-line"/>
  <text x="856" y="164" class="tiny" fill="#60a5fa">namespace tree + block locations</text>

  <text x="324" y="626" class="tiny">NameNode 不保存文件内容；文件内容按 block 分散在 DataNode，本地磁盘故障由副本和重复制处理。</text>
</svg>
