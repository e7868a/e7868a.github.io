<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .small { fill: #94a3b8; font-size: 9px; }
      .tiny { fill: #cbd5e1; font-size: 8px; }
      .zone { fill: rgba(15,23,42,0.56); stroke: #475569; stroke-width: 1.1; }
      .master { fill: rgba(120,53,15,0.36); stroke: #fbbf24; stroke-width: 1.5; }
      .journal { fill: rgba(76,29,149,0.44); stroke: #a78bfa; stroke-width: 1.3; }
      .zk { fill: rgba(8,51,68,0.44); stroke: #22d3ee; stroke-width: 1.3; }
      .worker { fill: rgba(6,78,59,0.42); stroke: #34d399; stroke-width: 1.5; }
      .client { fill: rgba(59,130,246,0.34); stroke: #60a5fa; stroke-width: 1.5; }
      .optional { fill: rgba(30,41,59,0.62); stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.1; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1220" height="720" fill="#0f172a"/>
  <rect width="1220" height="720" fill="url(#grid)"/>

  <text x="34" y="38" class="title">HDFS 逻辑部署</text>
  <text x="34" y="58" class="subtitle">生产环境通常把元数据高可用、共享 edits、故障切换、存储节点和计算节点分开理解；物理上可以按机器规模合并或拆分。</text>

  <g transform="translate(44 106)">
    <rect x="0" y="0" width="222" height="480" rx="12" class="zone"/>
    <text x="18" y="28" class="small" fill="#cbd5e1">Client / Edge</text>
    <rect x="28" y="70" width="166" height="62" rx="8" fill="#0f172a"/>
    <rect x="28" y="70" width="166" height="62" rx="8" class="client"/>
    <text x="111" y="95" text-anchor="middle" class="label">Gateway</text>
    <text x="111" y="114" text-anchor="middle" class="tiny">hdfs dfs / app submit</text>
    <rect x="28" y="166" width="166" height="62" rx="8" fill="#0f172a"/>
    <rect x="28" y="166" width="166" height="62" rx="8" class="client"/>
    <text x="111" y="191" text-anchor="middle" class="label">Spark / Hive</text>
    <text x="111" y="210" text-anchor="middle" class="tiny">read/write HDFS</text>
    <rect x="28" y="262" width="166" height="62" rx="8" fill="#0f172a"/>
    <rect x="28" y="262" width="166" height="62" rx="8" class="optional"/>
    <text x="111" y="287" text-anchor="middle" class="label">Router</text>
    <text x="111" y="306" text-anchor="middle" class="tiny">federation / view</text>
  </g>

  <g transform="translate(324 106)">
    <rect x="0" y="0" width="366" height="480" rx="12" class="zone"/>
    <text x="18" y="28" class="small" fill="#cbd5e1">Master / Metadata</text>
    <rect x="38" y="62" width="132" height="70" rx="8" fill="#0f172a"/>
    <rect x="38" y="62" width="132" height="70" rx="8" class="master"/>
    <text x="104" y="90" text-anchor="middle" class="label">NN Active</text>
    <text x="104" y="110" text-anchor="middle" class="tiny">serves namespace</text>
    <rect x="198" y="62" width="132" height="70" rx="8" fill="#0f172a"/>
    <rect x="198" y="62" width="132" height="70" rx="8" class="master"/>
    <text x="264" y="90" text-anchor="middle" class="label">NN Standby</text>
    <text x="264" y="110" text-anchor="middle" class="tiny">keeps state hot</text>

    <rect x="48" y="190" width="78" height="52" rx="7" fill="#0f172a"/>
    <rect x="48" y="190" width="78" height="52" rx="7" class="journal"/>
    <text x="87" y="220" text-anchor="middle" class="tiny">JN 1</text>
    <rect x="146" y="190" width="78" height="52" rx="7" fill="#0f172a"/>
    <rect x="146" y="190" width="78" height="52" rx="7" class="journal"/>
    <text x="185" y="220" text-anchor="middle" class="tiny">JN 2</text>
    <rect x="244" y="190" width="78" height="52" rx="7" fill="#0f172a"/>
    <rect x="244" y="190" width="78" height="52" rx="7" class="journal"/>
    <text x="283" y="220" text-anchor="middle" class="tiny">JN 3</text>
    <text x="184" y="270" text-anchor="middle" class="small">Quorum Journal Manager</text>

    <rect x="48" y="330" width="78" height="52" rx="7" fill="#0f172a"/>
    <rect x="48" y="330" width="78" height="52" rx="7" class="zk"/>
    <text x="87" y="360" text-anchor="middle" class="tiny">ZK 1</text>
    <rect x="146" y="330" width="78" height="52" rx="7" fill="#0f172a"/>
    <rect x="146" y="330" width="78" height="52" rx="7" class="zk"/>
    <text x="185" y="360" text-anchor="middle" class="tiny">ZK 2</text>
    <rect x="244" y="330" width="78" height="52" rx="7" fill="#0f172a"/>
    <rect x="244" y="330" width="78" height="52" rx="7" class="zk"/>
    <text x="283" y="360" text-anchor="middle" class="tiny">ZK 3</text>
    <text x="184" y="410" text-anchor="middle" class="small">ZKFC coordinates failover</text>
  </g>

  <g transform="translate(748 106)">
    <rect x="0" y="0" width="420" height="480" rx="12" class="zone"/>
    <text x="18" y="28" class="small" fill="#cbd5e1">Worker / Storage Racks</text>
    <g transform="translate(32 64)">
      <rect x="0" y="0" width="158" height="314" rx="10" class="zone"/>
      <text x="18" y="27" class="small">Rack A</text>
      <rect x="24" y="54" width="110" height="62" rx="7" fill="#0f172a"/>
      <rect x="24" y="54" width="110" height="62" rx="7" class="worker"/>
      <text x="79" y="80" text-anchor="middle" class="label">DN + NM</text>
      <text x="79" y="98" text-anchor="middle" class="tiny">disks / containers</text>
      <rect x="24" y="142" width="110" height="62" rx="7" fill="#0f172a"/>
      <rect x="24" y="142" width="110" height="62" rx="7" class="worker"/>
      <text x="79" y="168" text-anchor="middle" class="label">DN + NM</text>
      <text x="79" y="186" text-anchor="middle" class="tiny">JBOD volumes</text>
      <rect x="24" y="230" width="110" height="62" rx="7" fill="#0f172a"/>
      <rect x="24" y="230" width="110" height="62" rx="7" class="worker"/>
      <text x="79" y="256" text-anchor="middle" class="label">DN + NM</text>
      <text x="79" y="274" text-anchor="middle" class="tiny">block replicas</text>
    </g>
    <g transform="translate(230 64)">
      <rect x="0" y="0" width="158" height="314" rx="10" class="zone"/>
      <text x="18" y="27" class="small">Rack B</text>
      <rect x="24" y="54" width="110" height="62" rx="7" fill="#0f172a"/>
      <rect x="24" y="54" width="110" height="62" rx="7" class="worker"/>
      <text x="79" y="80" text-anchor="middle" class="label">DN + NM</text>
      <text x="79" y="98" text-anchor="middle" class="tiny">remote replicas</text>
      <rect x="24" y="142" width="110" height="62" rx="7" fill="#0f172a"/>
      <rect x="24" y="142" width="110" height="62" rx="7" class="worker"/>
      <text x="79" y="168" text-anchor="middle" class="label">DN + NM</text>
      <text x="79" y="186" text-anchor="middle" class="tiny">data locality</text>
      <rect x="24" y="230" width="110" height="62" rx="7" fill="#0f172a"/>
      <rect x="24" y="230" width="110" height="62" rx="7" class="worker"/>
      <text x="79" y="256" text-anchor="middle" class="label">DN + NM</text>
      <text x="79" y="274" text-anchor="middle" class="tiny">block replicas</text>
    </g>
  </g>

  <path d="M 266 202 C 286 160, 304 144, 324 134" class="line"/>
  <path d="M 748 194 C 730 194, 720 198, 690 202" class="line"/>
  <path d="M 504 238 C 490 190, 480 156, 456 132" class="dashed"/>
  <path d="M 514 238 C 540 188, 548 156, 578 132" class="dashed"/>
  <path d="M 504 382 C 482 334, 458 236, 436 132" class="dashed"/>
  <path d="M 566 382 C 594 332, 620 236, 604 132" class="dashed"/>
  <path d="M 690 492 C 734 474, 742 430, 780 420" class="dashed"/>

  <text x="252" y="150" class="tiny">metadata RPC / failover proxy</text>
  <text x="704" y="178" class="tiny">heartbeats + block reports</text>
  <text x="496" y="282" class="tiny">edits quorum</text>
  <text x="542" y="432" class="tiny">active election + fencing</text>
  <text x="44" y="656" class="tiny">NN=NameNode, JN=JournalNode, ZK=ZooKeeper, ZKFC=ZooKeeper Failover Controller, DN=DataNode, NM=YARN NodeManager。</text>
</svg>
